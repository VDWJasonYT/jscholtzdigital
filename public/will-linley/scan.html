<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Demo door scanner · Will Linley Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@400;500;650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="demo-banner" role="status">Demo scanner. These tickets are not valid for a real door.</div>
  <main class="narrow">
    <p class="kicker">Staff only</p>
    <h1 class="section-title">Door scanner</h1>
    <p class="lede">Enter the staff PIN, then paste or type the QR payload from a demo ticket.</p>
    <form id="scan-form">
      <div class="field">
        <label for="pin">Staff PIN</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="qr">Ticket code</label>
        <input id="qr" name="qr" required placeholder="JSD1....">
      </div>
      <button class="btn" type="submit">Validate ticket</button>
    </form>
    <p class="lede" id="result" role="status"></p>
    <p class="tiny">The camera scanner can be added later. For this demo, paste the code from the ticket email or confirmation page.</p>
  </main>
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/scan.js"></script>
</body>
</html>
